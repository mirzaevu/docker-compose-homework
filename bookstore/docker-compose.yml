services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore_user
      POSTGRES_PASSWORD: bookstore_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodata:/data/db
    restart: unless-stopped

  bookstore:
    image: bookstore-flask:v1
    container_name: bookstore
    ports:
      - "5000:5000"
    env_file:
      - ./.env
    depends_on:
      - postgres
    restart: unless-stopped

  bookstore-order-svc:
    image: bookstore-order-svc-fastapi:v1
    container_name: bookstore-order-svc
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://admin:password@mongodb:27017/?authSource=admin
      DATABASE_NAME: bookstore_order
      SECRET_KEY: "change-me"
      DEBUG: "True"
    depends_on:
      - mongodb
    restart: unless-stopped

  api-gateway:
    image: bookstore-api-gateway-go:v1
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      GIN_MODE: "release"
      BOOKSTORE_SERVICE_URL: http://bookstore:5000
      ORDER_SERVICE_URL: http://bookstore-order-svc:8000
      JWT_SECRET: "secret-key"
      TOKEN_EXPIRY: "24h"
      ALLOWED_ORIGINS: "*"
    depends_on:
      - bookstore
      - bookstore-order-svc
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
